name: Temporary targeted muscle role repair

on:
  push:
    branches: [audit/canonical-muscle-primary-20261019]

permissions:
  contents: write

jobs:
  repair-authority-once:
    if: "${{ github.event.head_commit.message == 'ci(temp): run targeted 18 muscle repairs' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact repairs and regenerate only canonical authority outputs
        run: |
          python -m pip install -r tools/metadata_authority/requirements.txt
          python tools/metadata_authority/repair_muscle_prime_movers_20261019.py
          python tools/metadata_authority/repair_muscle_prime_movers_20261019.py --apply
          python tools/metadata_authority/validate_authority_workbook.py --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx
          python tools/metadata_authority/export_canonical_metadata.py --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx --output app/src/main/assets/metadata/canonical_v1
          python tools/metadata_authority/export_canonical_metadata.py --check --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx --output app/src/main/assets/metadata/canonical_v1
          python -m unittest discover -s tools/metadata_authority/tests
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx app/src/main/assets/metadata/canonical_v1 docs/metadata_authority/metadata_display_resource_manifest.json
          git commit -m "[metadata-audit-generated] fill missing prime movers; preserve PR28 role changes"
          git push origin HEAD:audit/canonical-muscle-primary-20261019
