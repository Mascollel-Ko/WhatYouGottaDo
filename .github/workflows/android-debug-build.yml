name: Android Debug Build

on:
  push:
    branches:
      - main
      - fatigue-redesign-from-v0.3.6.4
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate canonical protocol documentation
        run: python scripts/validate_protocol_docs.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore CI debug keystore
        env:
          ANDROID_CI_KEYSTORE_B64: ${{ secrets.ANDROID_CI_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_CI_KEYSTORE_B64:-}" || {
            echo "::error::ANDROID_CI_KEYSTORE_B64 is not configured"
            exit 1
          }
          keystore="$RUNNER_TEMP/whatyougottado-ci-debug.jks"
          printf '%s' "$ANDROID_CI_KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore" || {
            echo "::error::CI debug keystore decode produced an empty file"
            exit 1
          }
          chmod 600 "$keystore"

      - name: Verify CI debug keystore credentials
        env:
          ANDROID_CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          ANDROID_CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          ANDROID_CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_CI_KEYSTORE_PASSWORD:-}" || {
            echo "::error::ANDROID_CI_KEYSTORE_PASSWORD is not configured"
            exit 1
          }
          test -n "${ANDROID_CI_KEY_ALIAS:-}" || {
            echo "::error::ANDROID_CI_KEY_ALIAS is not configured"
            exit 1
          }
          test -n "${ANDROID_CI_KEY_PASSWORD:-}" || {
            echo "::error::ANDROID_CI_KEY_PASSWORD is not configured"
            exit 1
          }
          keytool -list -v \
            -keystore "$RUNNER_TEMP/whatyougottado-ci-debug.jks" \
            -alias "$ANDROID_CI_KEY_ALIAS" \
            '-storepass:env' ANDROID_CI_KEYSTORE_PASSWORD > /dev/null

      - name: Verify Google Web Client ID configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_WEB_CLIENT_ID:-}" || {
            echo "::error::GOOGLE_WEB_CLIENT_ID repository variable is not configured"
            exit 1
          }
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}" || {
            echo "::error::SUPABASE_PUBLISHABLE_KEY repository secret is not configured"
            exit 1
          }
          echo "Google Web Client ID configured: yes"
          echo "Supabase publishable key configured: yes"

      - name: Run debug unit tests
        env:
          ANDROID_CI_KEYSTORE_PATH: ${{ runner.temp }}/whatyougottado-ci-debug.jks
          ANDROID_CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          ANDROID_CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          ANDROID_CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew testDebugUnitTest -Pgoogle.webClientId="$GOOGLE_WEB_CLIENT_ID" -Psupabase.publishableKey="$SUPABASE_PUBLISHABLE_KEY"

      - name: Assemble debug APK
        env:
          ANDROID_CI_KEYSTORE_PATH: ${{ runner.temp }}/whatyougottado-ci-debug.jks
          ANDROID_CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          ANDROID_CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          ANDROID_CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew assembleDebug -Pgoogle.webClientId="$GOOGLE_WEB_CLIENT_ID" -Psupabase.publishableKey="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify CI debug APK signer
        env:
          ANDROID_CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          ANDROID_CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" || {
            echo "::error::No debug APK was produced"
            exit 1
          }
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner" || {
            echo "::error::Android apksigner was not found"
            exit 1
          }
          certs="$RUNNER_TEMP/whatyougottado-ci-debug-apksigner.txt"
          "$apksigner" verify --print-certs "$apk" > "$certs" 2>&1
          expected="$(keytool -list -v \
            -keystore "$RUNNER_TEMP/whatyougottado-ci-debug.jks" \
            -alias "$ANDROID_CI_KEY_ALIAS" \
            '-storepass:env' ANDROID_CI_KEYSTORE_PASSWORD |
            awk -F': ' '/SHA1:/{print $2; exit}' |
            tr -d ':\r[:space:]' | tr '[:lower:]' '[:upper:]')"
          actual="$(grep -i -m1 'SHA-1 digest:' "$certs" |
            sed -En 's/.*SHA-1 digest:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' |
            tr -d ':\r[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$expected" || {
            echo "::error::Could not derive the CI keystore SHA-1"
            exit 1
          }
          test -n "$actual" || {
            echo "::error::APK signer certificate SHA-1 was not reported"
            exit 1
          }
          test "$expected" = "$actual" || {
            echo "::error::APK signer SHA-1 does not match the CI keystore"
            exit 1
          }
          {
            echo "## Android CI debug signing certificate"
            echo
            echo "SHA-1: $expected"
            echo
            echo "Package: com.whatyougottado.app"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatYouGottaDo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
