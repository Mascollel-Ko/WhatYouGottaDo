name: Apply reviewed split-stance row/press metadata
on:
  push:
    branches:
      - feature/split-stance-row-press-20261110
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/metadata_authority/requirements.txt
      - name: Patch workbook and domain authority sources
        run: python tools/metadata_authority/apply_split_stance_row_press.py
      - name: Validate, export and recheck canonical assets
        run: |
          python tools/metadata_authority/validate_authority_workbook.py --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx
          python tools/metadata_authority/export_canonical_metadata.py --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx --output app/src/main/assets/metadata/canonical_v1
          python tools/metadata_authority/export_canonical_metadata.py --check --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx --output app/src/main/assets/metadata/canonical_v1
          git diff --check
      - name: Commit workbook and generated assets atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-split-stance-row-press.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat(metadata): register contralateral row-press canonical exercise"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
