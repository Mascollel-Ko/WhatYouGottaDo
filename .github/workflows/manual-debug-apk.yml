name: Manual Unverified Debug APK
run-name: Manual unverified debug APK for ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: true
        default: main

permissions:
  contents: read

jobs:
  build-manual-unverified-apk:
    name: Build manual unverified debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble manual unverified debug APK
        run: ./gradlew assembleDebug

      - name: Upload manual unverified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatYouGottaDo-manual-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
