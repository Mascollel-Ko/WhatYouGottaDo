name: One-shot verified muscle source repair

on:
  push:
    branches: [fix/muscle-metadata-ui-analysis-20261020]

permissions:
  contents: write

jobs:
  generate-verified-authority:
    if: "${{ github.event.head_commit.message == 'chore: run exact muscle metadata workbook repair' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook tooling
        run: python -m pip install -r tools/metadata_authority/requirements.txt
      - name: Apply only guarded, audited repairs to authority workbook
        run: |
          set -euo pipefail
          python tools/metadata_authority/repair_muscle_ui_analysis_20261020.py
          python tools/metadata_authority/repair_muscle_ui_analysis_20261020.py --apply
          python tools/metadata_authority/validate_authority_workbook.py --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx
      - name: Export all derived canonical assets from one workbook
        run: |
          python tools/metadata_authority/export_canonical_metadata.py --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx --output app/src/main/assets/metadata/canonical_v1
          python tools/metadata_authority/export_canonical_metadata.py --workbook docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx --output app/src/main/assets/metadata/canonical_v1 --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Restore debug keystore for Gradle metadata-contract tests
        env:
          ANDROID_CI_KEYSTORE_B64: ${{ secrets.ANDROID_CI_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_CI_KEYSTORE_B64:-}"
          printf '%s' "$ANDROID_CI_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/whatyougottado-ci-debug.jks"
          chmod 600 "$RUNNER_TEMP/whatyougottado-ci-debug.jks"
      - name: Generate projected semantic metadata revision
        env:
          UPDATE_METADATA_CONTRACT_ARTIFACTS: '1'
          ANDROID_CI_KEYSTORE_PATH: ${{ runner.temp }}/whatyougottado-ci-debug.jks
          ANDROID_CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          ANDROID_CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          ANDROID_CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          ./gradlew :app:testDebugUnitTest --tests 'com.training.trackplanner.data.ExerciseMetadataFieldRegistryContractTest.artifactsAreDeterministicAndCurrent' -Pgoogle.webClientId="$GOOGLE_WEB_CLIENT_ID" -Psupabase.publishableKey="$SUPABASE_PUBLISHABLE_KEY"
      - name: Update pinned test revision, preserving display-only hash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('app/src/main/assets/metadata/canonical_v1/metadata_revision_manifest.json').read_text(encoding='utf-8'))
          assert j['metadataDisplayDictionaryRevision']=='d5c6a5515efd013e97224f3418c3402619c6d68e589c1cd618cd14502f8b5406'
          new=j['semanticCanonicalMetadataRevision']
          old='a5484959a228c625bff50fdca2f03948faddb870a0c56f8d8f9ef17d8505ac44'
          assert new != old and len(new)==64
          p=Path('app/src/test/java/com/training/trackplanner/data/ExerciseMetadataFieldRegistryContractTest.kt')
          contents=p.read_text(encoding='utf-8')
          assert contents.count(old)==1
          p.write_text(contents.replace(old,new),encoding='utf-8')
          print('semantic metadata revision:',new)
          PY
      - name: Run targeted metadata validation and alignment tests
        env:
          ANDROID_CI_KEYSTORE_PATH: ${{ runner.temp }}/whatyougottado-ci-debug.jks
          ANDROID_CI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_CI_KEYSTORE_PASSWORD }}
          ANDROID_CI_KEY_ALIAS: ${{ secrets.ANDROID_CI_KEY_ALIAS }}
          ANDROID_CI_KEY_PASSWORD: ${{ secrets.ANDROID_CI_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python -m unittest discover -s tools/metadata_authority/tests -p 'test_metadata_authority.py' -v
          ./gradlew :app:testDebugUnitTest --tests 'com.training.trackplanner.analysis.lab.CanonicalMuscleUiAnalysisAlignmentTest' --tests 'com.training.trackplanner.data.ExerciseMetadataFieldRegistryContractTest' -Pgoogle.webClientId="$GOOGLE_WEB_CLIENT_ID" -Psupabase.publishableKey="$SUPABASE_PUBLISHABLE_KEY"
      - name: Commit only generated workbook and runtime authority artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/metadata_authority/WhatYouGottaDo_metadata_authority_v1.xlsx \
            app/src/main/assets/metadata/canonical_v1 \
            docs/metadata_authority/metadata_display_resource_manifest.json \
            docs/generated/metadata_field_display_contract.csv \
            app/src/main/res/values/metadata_display_catalog.xml \
            app/src/main/res/values-en/metadata_display_catalog.xml \
            app/src/test/java/com/training/trackplanner/data/ExerciseMetadataFieldRegistryContractTest.kt
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes generated'; exit 1; }
          git commit -m "[metadata-generated] additive muscle role, UI and analysis repair"
          git push origin HEAD:fix/muscle-metadata-ui-analysis-20261020
