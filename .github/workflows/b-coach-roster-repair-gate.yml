name: B-Coach Roster and Volume Repair Gate

on:
  push:
    branches:
      - feat/b-coach-v2-global-optimizer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify B-Coach metadata and scoring contract
        run: |
          python scripts/validate_protocol_docs.py
          python -m unittest discover -s tools/metadata_authority/tests -p 'test_b_balanced_target_task_relations.py' -v
      - name: Check Kotlin sources, focused search regressions and actual generated fixtures
        timeout-minutes: 45
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.training.trackplanner.data.v22.BBlockPurposePrescriptionTest' \
            --tests 'com.training.trackplanner.data.v22.BCoachMultiobjectiveProductionTest' \
            --tests 'com.training.trackplanner.data.v22.BCoachJointBlockOptimizerTest' \
            --tests 'com.training.trackplanner.data.v22.BCoachProductionQualityHarnessTest' \
            --tests 'com.training.trackplanner.data.v22.V22BadmintonHistoryIntegrationTest' \
            --stacktrace \
            -Pgoogle.webClientId="$GOOGLE_WEB_CLIENT_ID" \
            -Psupabase.publishableKey="$SUPABASE_PUBLISHABLE_KEY"
      - name: Upload generated prescription audit and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-coach-roster-and-volume-audit
          path: |
            app/build/reports/b-coach/b_coach_generation_fixtures.md
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
